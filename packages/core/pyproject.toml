[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name lives under the `pylithos` namespace because the bare `lithos`
# name is already taken on PyPI. Import module stays `lithos_core` (brand-consistent).
name = "pylithos-core"
version = "0.1.0"
description = "LITHOS canonical ground-motion schema and anomaly engine (Apache-2.0, standard statistics only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Northflow Technologies AS", email = "hello@northflow.no" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pyright>=1.1.350",
  "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["lithos_core"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
