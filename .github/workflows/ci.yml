name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, type, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/core[dev]" -e "packages/ingest[dev]" -e "packages/api[dev]"
      - name: Build hero scene fixture
        run: python -m lithos_ingest.hero
      - name: Ruff lint
        run: ruff check packages/core packages/ingest packages/api
      - name: Pyright typecheck
        run: pyright packages/core/lithos_core packages/ingest/lithos_ingest packages/api/lithos_api
      - name: Pytest with coverage
        run: |
          pytest packages --cov=lithos_core --cov=lithos_ingest --cov=lithos_api \
            --cov-report=term-missing --cov-fail-under=70

  licensing-firewall:
    name: Licensing firewall (no GPL imports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no LiCSBAS / licsar_proc imports are vendored
        run: |
          if grep -rEn "import +(licsbas|licsar_proc)|from +(licsbas|licsar_proc)" packages/; then
            echo "Licensing firewall violation: GPL LiCSBAS/licsar_proc code must not be imported."
            exit 1
          fi
          echo "Firewall intact: LiCSAR used as a network data source only."

  web:
    name: Web (lint, type, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  containers:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/Dockerfile.api -t lithos-api:ci .
      - name: Build web image
        run: docker build -f infra/Dockerfile.web -t lithos-web:ci .
