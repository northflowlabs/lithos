name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, type, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/core[dev]" -e "packages/ingest[dev]" -e "packages/api[dev]"
      - name: Ruff lint
        run: ruff check packages/core packages/ingest packages/api
      - name: Pyright typecheck
        run: pyright packages/core/lithos_core packages/ingest/lithos_ingest packages/api/lithos_api
      - name: Pytest with coverage
        run: |
          pytest packages --cov=lithos_core --cov=lithos_ingest --cov=lithos_api \
            --cov-report=term-missing --cov-fail-under=70

  licensing-firewall:
    name: Licensing firewall (no GPL imports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Assert no LiCSBAS / licsar_proc imports are vendored
        run: |
          # The tests name the forbidden imports to assert they are absent, so they are skipped.
          if grep -rEn --exclude-dir=tests --exclude-dir=node_modules "import +(licsbas|licsar_proc)|from +(licsbas|licsar_proc)" packages/; then
            echo "Licensing firewall violation: GPL LiCSBAS/licsar_proc code must not be imported."
            exit 1
          fi
          echo "Firewall intact: LiCSAR used as a network data source only."

  web:
    name: Web (lint, type, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # pnpm version from packageManager in packages/web/package.json.
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          package_json_file: packages/web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: packages/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  containers:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build API image
        run: docker build -f infra/Dockerfile.api -t lithos-api:ci .
      - name: Build web image
        run: docker build -f infra/Dockerfile.web -t lithos-web:ci .
