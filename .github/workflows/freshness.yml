name: Source freshness

# Scheduled check that EGMS / LiCSAR endpoints are reachable and reporting. New
# coverage events feed the public launch-cadence narrative; a down source alerts.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Probe upstream sources
        run: python infra/freshness_monitor.py
