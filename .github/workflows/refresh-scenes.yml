name: Refresh scenes

# Rebuilds the measured scenes and the frame index from the public archive, and offers the
# result as a pull request for a person to review. Run it by hand from the Actions tab. It
# reads about two products a second and keeps what it read in the Actions cache, so a later
# run only asks the archive for what is new. See docs/refresh.md, which also has the schedule
# to add once this has been run by hand a few times. A pull request opened by this workflow's
# token does not trigger CI, so close and reopen it, or run CI by hand, before merging.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/cache
          key: licsar-${{ github.run_id }}
          restore-keys: licsar-
      - name: Install
        run: pip install -e packages/core -e "packages/ingest[scenes]" "matplotlib==3.11.2" "rasterio==1.5.2"
      - name: Rebuild
        run: |
          python -m lithos_ingest.frames
          python -m lithos_ingest.scene bologna
          python -m lithos_ingest.export_web_assets
          python -m lithos_ingest.render_hero
      # Saved even when a step fails, so a run that was cut off does not read everything again.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: data/cache
          key: licsar-${{ github.run_id }}
      - name: Offer the result for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A build or crawl date alone is no reason for a pull request.
          git diff --quiet -I '"built":' -I '"crawled":' && { echo "Nothing changed"; exit 0; }
          branch="refresh-scenes-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/scenes packages/ingest/lithos_ingest/data packages/web/public/hero docs/assets/hero.png
          git commit -m "Refresh scenes from the archive"
          git push origin "$branch"
          gh pr create --title "Refresh scenes" --body "Rebuilt by the refresh-scenes workflow. Check the window and the station checks in data/scenes/*/meta.json before merging."
